# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Release

on:
  release:
    types:
      - published

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.3'

    - name: Install NSIS
      run: choco install nsis --no-progress --yes

    - name: Build installer
      shell: bash
      run: make package-windows VERSION="${{ github.event.release.tag_name }}"

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: ttm-setup
        path: dist/ttm_setup.exe

  package-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.3'

    - name: Build Debian package
      run: make package-linux VERSION="${{ github.event.release.tag_name }}"

    - name: Upload Debian package artifact
      uses: actions/upload-artifact@v4
      with:
        name: ttm-deb
        path: dist/ttm.deb

  upload-release-asset:
    needs:
    - package-windows
    - package-linux
    runs-on: ubuntu-latest
    steps:
    - name: Download installer artifact
      uses: actions/download-artifact@v4
      with:
        name: ttm-setup
        path: release

    - name: Download Debian package artifact
      uses: actions/download-artifact@v4
      with:
        name: ttm-deb
        path: release

    - name: Upload Windows installer
      id: upload-windows-installer
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release/ttm_setup.exe
        asset_name: ttm_setup.exe
        asset_content_type: application/octet-stream

    - name: Upload Debian package
      id: upload-debian-package
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release/ttm.deb
        asset_name: ttm.deb
        asset_content_type: application/vnd.debian.binary-package